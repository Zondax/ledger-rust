[package]
name = "bolos-derive"
version = "0.1.0"
authors = ["Zondax <hello@zondax.ch>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.106", features = ["full", "extra-traits", "visit"] }
quote = "1.0.40"
proc-macro2 = "1.0.101"

convert_case = "0.8.0"

[dev-dependencies]
bolos = { path = "../bolos" }
